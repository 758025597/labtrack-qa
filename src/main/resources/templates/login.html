<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body class="login-body">
<main class="login-card">
    <h1>LabTrack</h1>
    <p class="sub">Sistema de Gestión de Laboratorios</p>

    <div id="alerta-seguridad" class="alerta alerta-seguridad" th:if="${alertaSeguridad}" th:text="${alertaSeguridad}"></div>
    <div id="mensaje-error" class="alerta alerta-error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <form id="form-login" method="post" th:action="@{/login}" novalidate>
        <label for="codigo">Código de estudiante</label>
        <input id="codigo" name="codigo" type="text" th:value="${codigo}" autocomplete="username" placeholder="N00123456">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button id="btn-ingresar" type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
