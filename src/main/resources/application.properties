spring.application.name=labtrack
server.port=8080

# Base de datos en memoria (se recrea en cada arranque).
# REF-03: la contraseña de la BD se lee de una variable de entorno.
spring.datasource.url=jdbc:h2:mem:labtrack;DB_CLOSE_DELAY=-1
spring.datasource.username=${LABTRACK_DB_USER:sa}
spring.datasource.password=${LABTRACK_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# Claves de los usuarios de DEMOSTRACIÓN. En un servidor real se definen con variables de entorno.
labtrack.semilla.clave-encargado=${LABTRACK_CLAVE_ENCARGADO:Admin2026*}
labtrack.semilla.clave-estudiante=${LABTRACK_CLAVE_ESTUDIANTE:Lab2026*}
labtrack.semilla.clave-carga=${LABTRACK_CLAVE_CARGA:Carga2026*}
